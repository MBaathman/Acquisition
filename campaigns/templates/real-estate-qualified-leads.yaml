# TEMPLATE — Real estate, outcome: Qualified Leads.
# Shows that a new industry is onboarded by configuration alone. Copy, rename
# client/campaign ids, adjust ICP / geography / property types, set status: active.
version: 1

client:
  id: example-realty
  name: Example Realty
  industry: Real estate
  timezone: Asia/Riyadh

campaign:
  id: example-realty-qualified-leads
  name: Off-plan investors — Qualified Leads
  status: draft

outcome:
  key: qualified_lead
  label: Qualified Lead
  unit: lead
  description: A buyer or investor with verified budget, target area and timeline, handed to a sales agent.
  achievedWhen:
    all:
      - { field: event.type, op: eq, value: lead.verified }
  requiresQualification: true
  target: { count: 100 }
  conversionStep: { template: viewing_invite }

fields:
  - { key: buyer_type, label: Buyer type, entity: contact, type: enum, options: [investor, end_user, business_owner] }
  - { key: property_type, label: Property type, entity: prospect, type: multi_enum, options: [apartment, villa, office, retail, land] }
  - { key: target_area, label: Target area, entity: prospect, type: geo }
  - { key: budget, label: Budget (SAR), entity: prospect, type: money }
  - { key: timeline, label: Timeline, entity: prospect, type: enum, options: [0-3m, 3-6m, 6-12m, 12m+] }
  - { key: financing, label: Financing, entity: prospect, type: enum, options: [cash, mortgage, undecided] }

icp:
  description: Investors, buyers and business owners seeking property in selected areas.
  targetType: individual
  personas:
    - key: investor
      label: Investor
      match: { field: attributes.buyer_type, op: eq, value: investor }
    - key: business_owner
      label: Business owner
      match: { field: attributes.buyer_type, op: eq, value: business_owner }
    - key: end_user
      label: Home buyer
      match: { field: attributes.buyer_type, op: eq, value: end_user }
  fit:
    any:
      - { field: contact.city, op: in, value: [Riyadh, Jeddah, Dammam, Khobar] }
      - { field: attributes.target_area, op: in, value: [North Riyadh, Jeddah Waterfront] }

market:
  geographies: [SA-Riyadh, SA-Jeddah, SA-Eastern]
  languages: [ar, en]
  segments: [investors, buyers, business_owners]

offer:
  name: Off-plan launch
  valueProposition: Early access pricing on a new off-plan development with a flexible payment plan.
  proofPoints: [Developer track record, Flexible payment plan]
  callToAction: a private viewing

discovery:
  source: crm_import
  query: { list: investor-database }
  targetActivePool: 300
  batchSize: 50
  dedupeAcrossCampaigns: false

scoring:
  signals:
    - { key: investor, label: Investor, weight: 30, when: { field: attributes.buyer_type, op: eq, value: investor } }
    - { key: budget_fit, label: Budget ≥ 1.5M SAR, weight: 30, when: { field: attributes.budget, op: gte, value: 1500000 } }
    - { key: near_term, label: Buying within 6 months, weight: 25, when: { field: attributes.timeline, op: in, value: [0-3m, 3-6m] } }
    - { key: area_match, label: Target area match, weight: 15, when: { field: attributes.target_area, op: exists } }

qualification:
  framework: budget-area-timeline
  criteria:
    - { key: budget, label: Budget confirmed, required: true, when: { field: attributes.budget, op: gte, value: 800000 } }
    - { key: area, label: Target area known, required: true, when: { field: attributes.target_area, op: exists } }
    - { key: timeline, label: Within 12 months, required: true, when: { field: attributes.timeline, op: in, value: [0-3m, 3-6m, 6-12m] } }
    - { key: property_type, label: Property type known, when: { field: attributes.property_type, op: exists } }
  minCriteriaMet: 3

funnel:
  stages:
    - { key: new, label: New, milestone: discovered }
    - { key: contacted, label: Contacted, milestone: contacted }
    - { key: responding, label: Responding, milestone: engaged }
    - { key: qualified, label: Qualified, milestone: qualified }
    - { key: lead_verified, label: Verified Lead, milestone: outcome }
    - { key: not_a_fit, label: Not a fit, milestone: lost }

personalization:
  tone: warm, discreet
  language: ar
  templates:
    intro:
      body: |
        Hello {{contact.firstName | "there"}}, {{offer.valueProposition}} Would you like details for {{attributes.target_area | "your preferred area"}}?
    viewing_invite:
      body: |
        Thank you {{contact.firstName | "there"}}. We'd be glad to arrange {{offer.callToAction}} — which day suits you?

outreach:
  channels:
    - { key: whatsapp, handle: phone, consentRequired: true }
    - { key: email, handle: email }
  sequence:
    - { key: r1_intro, channel: auto, dayOffset: 0, template: intro }
    - { key: r2_follow_up, channel: auto, dayOffset: 3, template: intro }

replies:
  intents:
    - { key: interested, label: Interested, sentiment: positive, keywords: [interested, details, price, "مهتم", "تفاصيل"], milestone: engaged, stopSequence: true }
    - { key: not_interested, label: Not interested, sentiment: negative, keywords: ["not interested", "غير مهتم"], milestone: lost, stopSequence: true }
    - { key: unsubscribe, label: Opt-out, sentiment: negative, keywords: [stop, unsubscribe, "إلغاء"], milestone: lost, stopSequence: true, suppress: true }
    - { key: other, label: Other, sentiment: neutral }
  defaultIntent: other

autonomy:
  level: human_approval

constraints:
  quietHours: { startHour: 21, endHour: 9 }
  maxTouchesPerProspect: 3
  rateLimits:
    - { action: send_message, channel: whatsapp, perDay: 50 }
