<style>
/* Layout: an acquisition operating system — persistent sidebar on the reading-start side, context bar (client → campaign → outcome) on top, one workspace per page. */
:root {

  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --surface-3: #262c37; --ink: #f2f4f7; --ink-2: #b9c0cb; --ink-3: #8c95a3; --line: #2a313c;
    --accent: #3987e5; --accent-soft: #1a2c44; --accent-ink: #86b6ef; --pace: #7d8694;
    --good-ink: #5fd35f; --good-soft: #15301a; --warn-ink: #fab219; --warn-soft: #33290f; --critical-ink: #ee7b7b; --critical-soft: #3a1b1b;
    --side: #0a0e14; --side-ink: #c9d3e1; --side-ink-2: #7d8aa0; --side-active: #18233a; --side-line: #1b2638; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --surface-3: #262c37; --ink: #f2f4f7; --ink-2: #b9c0cb; --ink-3: #8c95a3; --line: #2a313c;
  --accent: #3987e5; --accent-soft: #1a2c44; --accent-ink: #86b6ef; --pace: #7d8694;
  --good-ink: #5fd35f; --good-soft: #15301a; --warn-ink: #fab219; --warn-soft: #33290f; --critical-ink: #ee7b7b; --critical-soft: #3a1b1b;
  --side: #0a0e14; --side-ink: #c9d3e1; --side-ink-2: #7d8aa0; --side-active: #18233a; --side-line: #1b2638; color-scheme: dark;
}
* { box-sizing: border-box; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }

.main { min-width: 0; display: flex; flex-direction: column; }
.ctx { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; padding-inline: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }

.picker label { font-size: .68rem; color: var(--ink-3); letter-spacing: .04em; }
.picker select { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 8px; padding: 4px 8px; max-width: 260px; }

.outcome-pill .ico { width: 16px; height: 16px; flex: none; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: .82rem; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.demo-banner { background: repeating-linear-gradient(-45deg, var(--warn-soft), var(--warn-soft) 10px, var(--surface) 10px, var(--surface) 20px); border-bottom: 1px solid var(--line); color: var(--warn-ink); font-size: .8rem; font-weight: 600; padding-block: 5px; padding-inline: 20px; text-align: center; }

.page { padding-block: 22px 56px; padding-inline: 20px; display: grid; gap: 18px; max-width: 1280px; width: 100%; margin-inline: auto; align-content: start; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.page-head p { color: var(--ink-2); max-width: 70ch; }
.crumbs { font-size: .78rem; color: var(--ink-3); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-hero { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }

.chip.crit { background: var(--critical-soft); color: var(--critical-ink); }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip.outline { background: transparent; border: 1px solid var(--line); }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs a { text-decoration: none; color: var(--ink-2); padding: 7px 12px; border-bottom: 2px solid transparent; font-size: .88rem; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs a .n { font-family: var(--font-data); font-size: .74rem; color: var(--ink-3); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }

th, td { text-align: start; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-3); font-weight: 600; font-size: .74rem; letter-spacing: .02em; background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
td .sub { display: block; color: var(--ink-3); font-size: .78rem; }
.nowrap { white-space: nowrap; }

.btn { font-size: .84rem; font-weight: 600; border-radius: 7px; padding: 6px 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-ink); }
.btn:hover { filter: brightness(1.05); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* metrics */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 0; }
.kpi b { font-size: 1.3rem; font-weight: 600; }
.kpi span { font-size: .76rem; color: var(--ink-3); }
.kpi.hl { border-color: var(--accent); background: var(--accent-soft); }
.kpi.hl b { color: var(--accent-ink); }

.goal-figure { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.goal-figure .big { font-family: var(--font-display); font-size: clamp(2.6rem, 6vw, 4rem); font-weight: 700; line-height: 1; }
.goal-figure .of { font-size: 1.05rem; color: var(--ink-2); }
.progress { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.fact { display: grid; gap: 0; } .fact b { font-size: 1.1rem; } .fact span { font-size: .78rem; color: var(--ink-3); }
.ctx-card { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; }
.ctx-card div { display: grid; } .ctx-card span { font-size: .72rem; color: var(--ink-3); } .ctx-card b { font-weight: 600; }

/* charts */
.chart { position: relative; direction: ltr; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font-family: var(--font-body); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-inline-end: 6px; }
.legend i.pace { border-top: 2px dashed var(--pace); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .78rem; padding: 5px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); direction: rtl; z-index: 3; }
[dir="ltr"] .tip { direction: ltr; }

/* funnel & bars */
.funnel { display: grid; gap: 4px; }
.fstage { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 56px; align-items: center; gap: 10px; }
.fstage .name { font-size: .87rem; color: var(--ink-2); }
.bar { height: 22px; background: var(--surface-2); border-radius: 4px; position: relative; }
.bar > i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--accent); border-radius: 4px; min-width: 2px; }
.fstage.out .bar > i { background: var(--good); }
.fstage.lost .bar > i { background: var(--pace); }
.fstage .count { text-align: end; font-weight: 500; }
.frate { font-size: .74rem; color: var(--ink-3); padding-inline-start: calc(min(170px, 30%) + 10px); }
.hbars { display: grid; gap: 7px; }

.hbar .track { height: 14px; background: var(--surface-2); border-radius: 3px; position: relative; }
.hbar .track > i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--accent); border-radius: 3px; }
.scorebar { display: inline-grid; grid-template-columns: 54px auto; align-items: center; gap: 6px; }
.scorebar .t { height: 6px; background: var(--surface-3); border-radius: 3px; position: relative; overflow: hidden; }
.scorebar .t i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--accent); }

.list { display: grid; gap: 10px; }

.item.s-approval { border-inline-start-color: var(--accent); }

.item.s-good { border-inline-start-color: var(--good); }
.item.done { opacity: .6; }
.item-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: baseline; }
.item-top b { font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8rem; color: var(--ink-3); align-items: center; }

.note { font-size: .82rem; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.levels { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.levels .lvl { padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-3); font-weight: 600; font-size: .84rem; }
.levels .lvl.on { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 92px 18px minmax(0, 1fr); gap: 8px; font-size: .84rem; }
.tl .when { color: var(--ink-3); font-size: .76rem; text-align: end; padding-top: 2px; }
.tl .dot { position: relative; } .tl .dot::before { content: ""; position: absolute; inset-inline-start: 7px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl .dot::after { content: ""; position: absolute; inset-inline-start: 3px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl .dot.h::after { border-color: var(--good); } .tl .dot.s::after { border-color: var(--pace); }
.tl .what { padding-bottom: 12px; min-width: 0; overflow-wrap: anywhere; }

.scrim { position: fixed; inset: 0; background: rgb(8 12 20 / .45); z-index: 40; }
.drawer { position: fixed; inset-block: 0; inset-inline-end: 0; width: min(560px, 100%); background: var(--bg); z-index: 41; overflow-y: auto; padding-block: calc(16px + env(safe-area-inset-top, 0px)) 32px; padding-inline: 18px; display: grid; gap: 14px; align-content: start; box-shadow: 0 0 40px rgb(0 0 0 / .25); }
.drawer-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }

.toast { position: fixed; inset-inline: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 440px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: .86rem; text-align: center; z-index: 60; }

@media (max-width: 960px) {

  [dir="ltr"] .side { transform: translateX(-100%); }

</style>

  svg.append(svgEl("path", { d: `M${pts.join(" L")}`, fill: "none", stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round" }));
  const last = series.length - 1;
  svg.append(svgEl("circle", { cx: x(last), cy: y(series[last]), r: 5, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }));

function barChart(host, values, days, label) {

  const counted = c.outcomes.filter((o) => o.counted).length;
  return stages.filter((s) => s.key !== lostKey).map((s) => {
    let n;

function attentionList(limit) {

  for (const r of c.recommendations.filter((r) => r.status === "open")) items.push({ kind: "rec", r });
  for (const e of c.exceptions.filter((e) => e.status === "open")) items.push({ kind: "exc", e });
  const open = items.filter((i) => !S.decided[i.a?.id || i.r?.id || i.e?.id]);
  const shown = (limit ? open.slice(0, limit) : items);
  if (!shown.length) return `<div class="empty">${esc(S.lang === "ar" ? "لا شيء ينتظرك الآن. المحرك يعمل." : "Nothing is waiting on you. The engine is running.")}</div>`;

}

function recSummary(r) {
  const ev = r.evidence || {};
  const rate = (a) => (a && a.sent ? Math.round(((a.positive + 2 * a.outcomes) / a.sent) * 1000) / 10 : 0);
  if (r.change?.op === "disable_variant") {
    const tk = r.change.templateKey; const b = ev.best, w = ev.worst;
    return S.lang === "ar" ? `إيقاف «${variantLabel(`${tk}:${w.key}`)}» (${rate(w)}% من ${w.sent} رسالة) والاعتماد على «${variantLabel(`${tk}:${b.key}`)}» (${rate(b)}% من ${b.sent}).`
      : `Retire "${variantLabel(`${tk}:${w.key}`)}" (${rate(w)}% of ${w.sent} sends) in favour of "${variantLabel(`${tk}:${b.key}`)}" (${rate(b)}% of ${b.sent}).`;
  }
  if (r.change?.op === "raise_min_score") {
    const tier = C().config.scoring.tiers.find((x) => x.key === ev.tier);
    return S.lang === "ar" ? `«${L(tier?.label ?? ev.tier)}» لم تُنتج ردوداً إيجابية من ${ev.sent} عميلاً تم التواصل معهم — ركّز على تقييم ${r.change.value} فأعلى.`
      : `"${tier?.label ?? ev.tier}" produced no positive replies from ${ev.sent} contacted prospects — focus on scores of ${r.change.value}+.`;
  }
  return r.summary;
}

function pageScoring() {

  const rows = sc.signals.map((s) => {
    const withS = contacted.filter((p) => p.breakdown.some((b) => b.key === s.key)); const without = contacted.filter((p) => !p.breakdown.some((b) => b.key === s.key));

    return { s, share: P.length ? P.filter((p) => p.breakdown.some((b) => b.key === s.key)).length / P.length : 0, rWith: rate(withS), rWithout: rate(without), nWith: withS.length };
  });

    [ar ? "حدود المعدل" : "Rate limits", (k.rateLimits || []).map((r) => `${r.action.map((a) => WORKFLOWS.find(([w]) => w === a)?.[1][S.lang].split(" (")[0] ?? a).join(" + ")}${r.channel ? ` · ${L(r.channel)}` : ""}: ${r.perHour ? `${r.perHour}${ar ? "/ساعة" : "/h"} ` : ""}${r.perDay ? `${r.perDay}${ar ? "/يوم" : "/day"}` : ""}`).join(" · ") || "—"],

    [ar ? "إعادة المحاولة" : "Retries", ar ? `${k.retry?.maxAttempts ?? 3} محاولات مع مهلة متزايدة للأخطاء المؤقتة.` : `${k.retry?.maxAttempts ?? 3} attempts with growing backoff for transient errors.`],
    [ar ? "الفشل" : "Failures", ar ? "الفشل النهائي يوقف العميل المحتمل ويرفع استثناءً لشخص." : "A final failure pauses the prospect and raises an exception for a person."],
    [ar ? "الإحالة" : "Escalation", cfg.escalation.map((e) => L(e.reason)).join(" · ") || "—"],
    [ar ? "سجل التدقيق" : "Audit log", ar ? "كل اقتراح وقرار وتنفيذ وإعادة محاولة وفشل مسجّل." : "Every proposal, decision, execution, retry and failure is recorded."],
  ];
  return `${pageHead(t("automation"), ar ? "الانتقال من الموافقة البشرية إلى الأتمتة المساعَدة ثم التشغيل المستقل هو تغيير في الإعدادات، لا إعادة بناء. في مرحلة التجربة تبقى الموافقة البشرية مفعّلة." : "Moving from human approval to assisted to autonomous is a configuration change, not a rewrite. During the MVP, human approval stays on.")}
  <section class="panel"><div class="levels">${["human_approval", "assisted", "autonomous"].map((l, i) => `${i ? `<span class="muted">${ar ? "←" : "→"}</span>` : ""}<span class="lvl ${cfg.autonomy.level === l ? "on" : ""}">${esc(t("level_" + l))}</span>`).join("")}</div>
    <p class="small muted">${esc(ar ? "الإجراءات الداخلية (بحث، تقييم، تأهيل) تلقائية دائماً. ما يراه الشخص الآخر (رسائل، ردود، حجز) يحتاج موافقة في هذه المرحلة." : "Internal actions (research, scoring, qualification) always run on their own. Anything another person sees (messages, replies, booking) needs approval at this stage.")}</p></section>
  <section class="panel"><h2>${esc(t("workflow"))}</h2><div class="table-wrap"><table><thead><tr><th>${esc(t("workflow"))}</th><th>${esc(t("risk"))}</th><th>${esc(t("mode"))}</th><th>${esc(t("threshold"))}</th><th></th></tr></thead><tbody>
  ${WORKFLOWS.map(([key, lab]) => { const m = modes[key]; if (!m) return ""; return `<tr><td>${esc(lab[S.lang])}</td><td><span class="chip">${esc(t("risk_" + m.risk))}</span></td><td><span class="chip ${m.mode === "autonomous" ? "good" : m.mode === "approval" ? "accent" : "crit"}">${esc(t("mode_" + m.mode))}</span></td><td class="num">${m.mode === "autonomous" && m.minConfidence > 0 ? Math.round(m.minConfidence * 100) + "%" : "—"}</td><td><button class="btn" type="button" data-act="toast" data-msg="${esc(ar ? "تغيير الأتمتة للمدير فقط ويُسجَّل في التدقيق (معاينة)" : "Automation changes are admin-only and audited (preview)")}" ${m.risk === "internal" ? "disabled" : ""}>${esc(ar ? "تغيير" : "Change")}</button></td></tr>`; }).join("")}
  <tr><td>${esc(ar ? "تتبع النتائج" : "Outcome tracking")}</td><td><span class="chip">${esc(ar ? "نظام" : "System")}</span></td><td><span class="chip good">${esc(t("mode_autonomous"))}</span></td><td>—</td><td></td></tr></tbody></table></div></section>
  <section class="panel"><h2>${esc(t("guardrails"))}</h2><div class="grid g3" style="gap:12px">${guard.map(([h, d]) => `<div class="item"><b>${esc(h)}</b><p class="small" style="color:var(--ink-2)">${esc(d)}</p></div>`).join("")}</div></section>`;
}

const auditText = (e) => {
  const ar = S.lang === "ar"; const d = e.detail || {}; const p = X().P.get(e.prospectId); const pn = p ? who(p) : "";
  const T = {
    "research.completed": ar ? `بحث ${pn}: ${d.signals} إشارة بمصادر${d.rejectedUnsourced?.length ? `، ${d.rejectedUnsourced.length} بلا مصدر تم تجاهلها` : ""}` : `Researched ${pn}: ${d.signals} sourced signals${d.rejectedUnsourced?.length ? `, ${d.rejectedUnsourced.length} unsourced discarded` : ""}`,
    "score.changed": ar ? `تقييم ${pn}: ${d.from ?? "—"} ← ${d.to}/${d.max}` : `Scored ${pn}: ${d.from ?? "—"} → ${d.to}/${d.max}`,
    "contact.lookup": ar ? `البحث عن جهة اتصال لـ${pn}: ${t("cs_" + d.status)}` : `Contact lookup for ${pn}: ${t("cs_" + d.status)}`,
    "action.proposed": ar ? `اقتراح إجراء (${d.type}) لـ${pn || "الحملة"}` : `Proposed ${d.type} for ${pn || "the campaign"}`,
    "action.pending_approval": ar ? `بانتظار الموافقة: ${pn}` : `Waiting for approval: ${pn}`,
    "action.approved": ar ? `اعتمده شخص: ${pn}` : `Approved by a person: ${pn}`, "action.auto_approved": ar ? `نُفّذ تلقائياً: ${pn || "الحملة"}` : `Auto-approved: ${pn || "campaign"}`,
    "action.rejected": ar ? `رفضه شخص: ${pn} — ${d.reason}` : `Rejected: ${pn} — ${d.reason}`, "action.succeeded": ar ? `تم التنفيذ: ${pn || "الحملة"}` : `Executed: ${pn || "campaign"}`,
    "action.deferred": ar ? `تأجيل: ${d.reason}` : `Deferred: ${d.reason}`, "action.blocked": ar ? `أوقفته السياسات: ${d.reason}` : `Blocked: ${d.reason}`,
    "reply.classified": ar ? `تصنيف رد ${pn}: ${L(X().intents.get(d.intent)?.label)} (${Math.round(d.confidence * 100)}%)` : `Classified reply from ${pn}: ${X().intents.get(d.intent)?.label} (${Math.round(d.confidence * 100)}%)`,
    "qualification.changed": ar ? `تأهيل ${pn}: ${d.qualified ? "مؤهَّل" : "غير مؤهَّل"}` : `Qualification of ${pn}: ${d.qualified ? "qualified" : "not qualified"}`,
    "outcome.achieved": ar ? `نتيجة محققة: ${pn}` : `Outcome achieved: ${pn}`, "event.recorded": ar ? `حدث: ${d.type} · ${pn}` : `Event: ${d.type} · ${pn}`,
    "stage.changed": ar ? `${pn}: ${stageLabel(d.from)} ← ${stageLabel(d.to)}` : `${pn}: ${stageLabel(d.from)} → ${stageLabel(d.to)}`,
    "exception.raised": ar ? `استثناء: ${L(d.reason)}` : `Exception: ${d.reason}`, "exception.resolved": ar ? `عولج استثناء` : `Exception resolved`,
    "sequence.step_skipped": ar ? `تخطي خطوة ${stepLabel(d.step)} لـ${pn} (قناة غير متاحة)` : `Skipped ${stepLabel(d.step)} for ${pn} (${d.reason})`,
  };
  if (e.event.startsWith("appointment.")) return (ar ? `${L(C().config.appointments?.singular || "")}: ${t({ scheduled: "scheduled", held: "held", cancelled: "cancelled", no_show: "noShow" }[e.event.split(".")[1]])} · ${pn}` : `${C().config.appointments?.singular}: ${e.event.split(".")[1]} · ${pn}`);
  return T[e.event] ?? e.event;
};
function pageAudit() {
  const c = C(); const ar = S.lang === "ar"; const cat = S.auditCat;
  const catOf = (ev) => Object.entries(AUDIT_CAT).find(([, evs]) => evs.includes(ev) || evs.some((x) => ev.startsWith(x.split(".")[0] + ".") && x.endsWith(".*")))?.[0] ?? (ev.startsWith("appointment.") ? "meetings" : "sending");
  const totals = {}; for (const [ev, n] of Object.entries(c.auditCounts)) { const k = catOf(ev); totals[k] = (totals[k] || 0) + n; }
  const list = c.audit.filter((e) => !cat || catOf(e.event) === cat);
  return `${pageHead(t("audit"), ar ? "كل ما يفعله المحرك أو الأشخاص مسجّل. هذا السجل هو أساس الثقة عندما يعمل المحرك باستقلالية." : "Everything the engine or a person does is recorded. This log is what makes autonomous operation trustworthy.")}
  ${isDraft() ? draftNotice() : `<section class="kpis">${Object.keys(AUDIT_CAT).map((k) => `<a href="#" data-act="auditcat" data-cat="${k}" class="kpi ${cat === k ? "hl" : ""}" style="text-decoration:none;color:inherit"><b class="num">${fmtNum(totals[k] || 0)}</b><span>${esc(AUDIT_CAT_LABEL[S.lang][k])}</span></a>`).join("")}</section>
  <section class="panel"><div class="panel-head"><h2>${esc(ar ? "أحدث الأحداث" : "Latest events")}${cat ? ` · ${esc(AUDIT_CAT_LABEL[S.lang][cat])}` : ""}</h2>${cat ? `<a href="#" data-act="auditcat" data-cat="">${esc(t("all"))}</a>` : ""}</div>
  <div class="timeline">${list.slice(0, 120).map((e) => `<div class="tl"><span class="when num">${esc(fmtDT(e.at))}</span><span class="dot ${e.actor === "user" ? "h" : e.actor === "system" ? "s" : ""}"></span><div class="what"><span class="chip outline tiny">${esc(t("actor_" + e.actor))}</span> ${e.prospectId ? `<a href="#" data-act="prospect" data-id="${esc(e.prospectId)}">${esc(auditText(e))}</a>` : esc(auditText(e))}</div></div>`).join("") || `<div class="empty">${esc(t("noItems"))}</div>`}</div>
  <p class="small muted">${esc(ar ? `يعرض آخر ${Math.min(120, list.length)} حدثاً من ${fmtNum(Object.values(c.auditCounts).reduce((a, b) => a + b, 0))} في سجل هذه الحملة.` : `Showing the latest ${Math.min(120, list.length)} of ${fmtNum(Object.values(c.auditCounts).reduce((a, b) => a + b, 0))} events in this campaign's log.`)}</p></section>`}`;
}

function pageSettings() {
  const cfg = C().config; const ar = S.lang === "ar";
  const row = (k, v) => `<div style="display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:10px;border-bottom:1px dashed var(--line);padding-block:7px"><span class="muted small">${esc(k)}</span><span>${v}</span></div>`;
  return `${pageHead(t("settings"), ar ? "إعدادات الحملة كما هي معرّفة في ملفها. أي تغيير يمر بمراجعة الإعدادات ثم يُطبَّق دون تعديل المحرك." : "The campaign's configuration as defined in its file. Changes go through config review and apply without engine changes.")}
  <section class="grid g2">
    <article class="panel"><h2>${esc(ar ? "الحملة والنتيجة" : "Campaign & outcome")}</h2>
      ${row(t("campaign"), esc(L(cfg.name)))}${row(ar ? "الحالة" : "Status", esc(t("status_" + cfg.status)))}${row(t("outcome"), esc(outcomePlural()))}${row(t("target"), `<span class="num">${cfg.outcome.target ?? "—"}</span>`)}
      ${row(ar ? "يشترط التأهيل" : "Requires qualification", esc(cfg.outcome.requiresQualification ? (ar ? "نعم" : "Yes") : (ar ? "لا" : "No")))}${row(ar ? "المنطقة الزمنية" : "Timezone", `<span class="ltr">${esc(cfg.timezone)}</span>`)}
      ${row(ar ? "الميزانية" : "Budget", cfg.budget ? `<span class="num">${money(cfg.budget.amount, cfg.budget.currency)}</span> / ${esc(cfg.budget.period)} <span class="chip warn">${esc(t("demo"))}</span>` : esc(t("notConfigured")))}</article>
    <article class="panel"><h2>${esc(ar ? "الشريحة المستهدفة والعرض" : "ICP & offer")}</h2>
      ${row(ar ? "الشريحة" : "ICP", `<span class="ltr small">${esc(cfg.icp || "—")}</span>`)}${row(ar ? "الشخصيات" : "Personas", esc(cfg.personas.map((p) => L(p.label)).join(SEP())))}
      ${row(ar ? "السوق" : "Market", `<span class="ltr small">${esc([...(cfg.market.geographies || []), ...(cfg.market.segments || [])].join(", "))}</span>`)}${row(ar ? "العرض" : "Offer", `<span class="ltr small">${esc(cfg.offer.valueProposition)}</span>`)}${row(ar ? "الدعوة" : "Call to action", `<span class="ltr small">${esc(cfg.offer.callToAction)}</span>`)}</article>
    <article class="panel"><h2>${esc(ar ? "التأهيل" : "Qualification")}</h2>${cfg.qualification.map((q) => row(L(q.label), q.required ? `<span class="chip accent">${esc(ar ? "مطلوب" : "Required")}</span>` : `<span class="chip">${esc(ar ? "اختياري" : "Optional")}</span>`)).join("")}</article>
    <article class="panel"><h2>${esc(t("funnel"))}</h2>${cfg.funnel.map((s) => row(L(s.label), `<span class="small muted ltr">${esc(s.milestone ? `milestone: ${s.milestone}` : "on business event")}</span>`)).join("")}</article>
  </section>`;
}

/* prospect drawer */
function drawer(id) {
  const c = C(); const x = X(); const p = x.P.get(id); if (!p) return "";
  const ar = S.lang === "ar";
  const thread = [...(x.sentBy.get(id) || []).map((a) => ({ at: a.executedAt, dir: "out", body: a.body, subject: a.subject, channel: a.channel, step: a.step })), ...(x.repliesBy.get(id) || []).map((r) => ({ at: r.at, dir: "in", body: r.body, intent: r.intent, channel: r.channel }))].sort((a, b) => (a.at || "").localeCompare(b.at || ""));
  const appt = c.appointments.filter((a) => a.prospectId === id);
  const out = c.outcomes.find((o) => o.prospectId === id && o.counted);
  return `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(p.company || p.contact)}">
    <div class="drawer-head"><div><div class="crumbs">${esc(t("prospects"))}</div><h2>${esc(p.company || p.contact)}</h2><div class="meta"><span>${esc(p.contact)} · ${esc(p.title || "")}</span><span>${esc(L(p.city))}</span>${p.employees ? `<span class="num">${p.employees} ${esc(ar ? "موظف" : "staff")}</span>` : ""}</div></div><button class="btn" type="button" data-act="close" aria-label="Close">✕</button></div>
    <div class="meta"><span class="chip accent">${esc(stageLabel(p.stage))}</span>${rsChip(p.researchStatus)}${csChip(p.contactStatus)}${out ? `<span class="chip good">✓ ${esc(outcomeLabel())}</span>` : ""}${p.parkedReason ? `<span class="chip">${esc(p.parkedReason === "no_contact" ? (ar ? "متوقف: لا جهة اتصال" : "Parked: no contact") : p.parkedReason)}</span>` : ""}${p.status === "parked" && !p.parkedReason ? `<span class="chip">${esc(ar ? "تحت حد التواصل" : "Below outreach threshold")}</span>` : ""}</div>
    <section class="panel"><div class="panel-head"><h3>${esc(t("score"))}</h3>${scoreBar(p)}</div>
      ${p.breakdown.length ? `<div class="hbars">${p.breakdown.map((b) => `<div class="hbar"><span>${esc(L(b.label))}${b.category === "timing" ? ` <span class="chip tiny">${esc(t("whyNow"))}</span>` : ""}</span><div class="track"><i style="width:${(b.weight / Math.max(...c.config.scoring.signals.map((s) => s.weight))) * 100}%"></i></div><span class="num">+${b.weight}</span></div>`).join("")}</div>` : `<p class="small muted">—</p>`}
      ${(() => { const missingSig = c.config.scoring.signals.filter((s) => !p.breakdown.some((b) => b.key === s.key)); return missingSig.length ? `<p class="tiny muted">${esc(ar ? "لم يتحقق: " : "Not met: ")}${esc(missingSig.map((s) => `${L(s.label)} (${s.weight})`).join(SEP()))}</p>` : ""; })()}</section>
    <section class="panel"><h3>${esc(t("research"))}</h3>${p.signals.length ? `<div class="signals">${p.signals.map((s) => `<div class="signal"><span><b>${esc(keyLabel(s.key))}:</b> ${esc(fmtVal(s.value))}</span><span class="tiny num">${Math.round(s.confidence * 100)}%</span><span class="src">${esc(t("source"))}: ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.source)}</a>` : esc(s.source)}</span></div>`).join("")}</div>` : `<p class="small muted">—</p>`}
      ${p.rejected.length ? `<p class="small" style="color:var(--warn-ink)">▲ ${esc(t("noSource"))}: ${esc(p.rejected.map(keyLabel).join(SEP()))}</p>` : ""}</section>
    ${p.qualification ? `<section class="panel"><h3>${esc(t("qualReasons"))}</h3><p class="small">✓ ${esc(p.qualification.met.map((k) => L(c.config.qualification.find((q) => q.key === k)?.label ?? k)).join(SEP()) || "—")}</p>${p.qualification.missing.length ? `<p class="small muted">✕ ${esc(p.qualification.missing.map((k) => L(c.config.qualification.find((q) => q.key === k)?.label ?? k)).join(SEP()))}</p>` : ""}</section>` : ""}
    ${appt.length ? `<section class="panel"><h3>${esc(L(c.config.appointments.label))}</h3>${appt.map((a) => `<p class="small">${esc(fmtDT(a.startsAt))} · ${esc(t({ scheduled: "scheduled", held: "held", cancelled: "cancelled", no_show: "noShow" }[a.status]))}</p>`).join("")}</section>` : ""}
    <section class="panel"><h3>${esc(ar ? "المحادثة" : "Conversation")}</h3>${thread.length ? thread.map((m) => `<div><div class="tiny muted">${esc(fmtDT(m.at))} · ${esc(L(m.channel))}${m.step ? ` · ${esc(stepLabel(m.step))}` : ""}${m.intent ? ` · ${intentChip(m.intent)}` : ""}</div><div class="msg ${m.dir === "in" ? "in" : ""} ${/[؀-ۿ]/.test(m.body || "") ? "" : "ltr"}">${m.subject ? `<span class="subj">${esc(m.subject)}</span>` : ""}${esc(m.body)}</div></div>`).join("") : `<p class="small muted">${esc(ar ? "لم يُتواصل معه بعد." : "Not contacted yet.")}</p>`}</section>
  </aside>`;
}

/* =========================================================== router */
const PAGES = { overview: pageOverview, campaigns: pageCampaigns, prospects: pageProspects, research: pageResearch, contacts: pageContacts, outreach: pageOutreach, replies: pageReplies, appointments: pageAppointments, outcomes: pageOutcomes, analytics: pageAnalytics, reports: pageReports, integrations: pageIntegrations, automation: pageAutomation, audit: pageAudit, settings: pageSettings, attention: pageAttention, recommendations: pageRecommendations };
const CLIENT_PAGES = new Set(["overview", "attention", "outcomes", "appointments", "recommendations", "reports"]);
function parseHash() {
  const h = (location.hash || "#overview").slice(1); const [route, ...rest] = h.split(".");
  S.route = PAGES[route] ? route : "overview"; S.sub = rest.join(".");
  if (S.view === "client" && !CLIENT_PAGES.has(S.route)) { S.route = "overview"; S.sub = ""; }
  if (S.route === "appointments" && !C().config.appointments) { S.route = "overview"; S.sub = ""; }
}
function render() {
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
  document.title = `${clientName(S.clientId)} · ${L(C().config.name)} — ${t("product")}`;
  parseHash();
  renderSide(); renderCtx();
  const page = document.getElementById("page");
  page.innerHTML = PAGES[S.route]();
  const c = C(); const days = c.daily.map((d) => d.day); let acc = 0; const cum = c.daily.map((d) => (acc += d.outcomes));
  page.querySelectorAll('[data-chart="trend"]').forEach((el) => lineChart(el, cum, c.config.outcome.target, days));
  page.querySelectorAll('[data-chart="sent"]').forEach((el) => barChart(el, c.daily.map((d) => d.sent), days, t("sentPerDay")));
  document.getElementById("overlay").innerHTML = S.drawer ? drawer(S.drawer) : "";
  document.getElementById("app").classList.remove("nav-open");
}
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (el.hidden = true), 2600); }

window.addEventListener("hashchange", () => { S.limit = 50; S.drawer = null; render(); document.getElementById("page").focus({ preventScroll: true }); window.scrollTo(0, 0); });
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (["prospect", "close", "auditcat", "pick"].includes(act) || el.tagName === "A") { if (act !== "pick") ev.preventDefault(); }
  if (act === "menu") return document.getElementById("app").classList.toggle("nav-open");
  if (act === "view") { S.view = el.dataset.v; persist(); if (S.view === "client" && !CLIENT_PAGES.has(S.route)) location.hash = "#overview"; render(); return; }
  if (act === "lang") { S.lang = el.dataset.v; persist(); render(); return; }
  if (act === "prospect") { S.drawer = el.dataset.id; render(); return; }
  if (act === "close") { S.drawer = null; render(); return; }
  if (act === "more") { S.limit += 50; render(); return; }
  if (act === "auditcat") { S.auditCat = el.dataset.cat; render(); return; }
  if (act === "pick") { S.clientId = el.dataset.client; S.campaignId = el.dataset.campaign; persist(); render(); return; }
  if (act === "decide") { S.decided[el.dataset.id] = el.dataset.d; toast(el.dataset.d === "approve" ? t("approvedToast") : el.dataset.d === "resolve" ? t("resolvedToast") : t("rejectedToast")); render(); return; }
  if (act === "toast") { toast(el.dataset.msg); return; }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && S.drawer) { S.drawer = null; render(); } });
document.addEventListener("input", (ev) => {
  const el = ev.target.closest("[data-filter]"); if (!el) return;
  S.filters[el.dataset.filter] = el.value; S.limit = 50;
  const pos = el.selectionStart; const key = el.dataset.filter; render();
  const again = document.querySelector(`[data-filter="${key}"]`); if (again && again.tagName === "INPUT") { again.focus(); try { again.setSelectionRange(pos, pos); } catch {} }
});
render();
</script>
