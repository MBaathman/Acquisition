<title>محرك الاستحواذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an acquisition operating system — persistent sidebar on the reading-start side, context bar (client → campaign → outcome) on top, one workspace per page. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #eef1f5; --surface-3: #e4e8ee;
  --ink: #111720; --ink-2: #4a5462; --ink-3: #6d7685; --line: #dde2ea;
  --accent: #2a78d6; --accent-soft: #dceafb; --accent-ink: #1c5cab; --pace: #8a93a1;
  --good: #0ca30c; --good-ink: #0b7a0b; --good-soft: #e1f3e1;
  --warn: #fab219; --warn-ink: #8a5b00; --warn-soft: #fdf1d6;
  --critical: #d03b3b; --critical-ink: #b42f2f; --critical-soft: #f9e1e1;
  --side: #0f1a2b; --side-ink: #c9d3e1; --side-ink-2: #8392a8; --side-active: #1d2c44; --side-line: #22324b;
  --font-display: "Reem Kufi", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --surface-3: #262c37; --ink: #f2f4f7; --ink-2: #b9c0cb; --ink-3: #8c95a3; --line: #2a313c;
    --accent: #3987e5; --accent-soft: #1a2c44; --accent-ink: #86b6ef; --pace: #7d8694;
    --good-ink: #5fd35f; --good-soft: #15301a; --warn-ink: #fab219; --warn-soft: #33290f; --critical-ink: #ee7b7b; --critical-soft: #3a1b1b;
    --side: #0a0e14; --side-ink: #c9d3e1; --side-ink-2: #7d8aa0; --side-active: #18233a; --side-line: #1b2638; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --surface-3: #262c37; --ink: #f2f4f7; --ink-2: #b9c0cb; --ink-3: #8c95a3; --line: #2a313c;
  --accent: #3987e5; --accent-soft: #1a2c44; --accent-ink: #86b6ef; --pace: #7d8694;
  --good-ink: #5fd35f; --good-soft: #15301a; --warn-ink: #fab219; --warn-soft: #33290f; --critical-ink: #ee7b7b; --critical-soft: #3a1b1b;
  --side: #0a0e14; --side-ink: #c9d3e1; --side-ink-2: #7d8aa0; --side-active: #18233a; --side-line: #1b2638; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14.5px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.3; }
h1 { font-size: 1.45rem; } h2 { font-size: 1.1rem; } h3 { font-size: .98rem; }
p { margin: 0; }
a { color: var(--accent-ink); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--ink-3); } .small { font-size: .84rem; } .tiny { font-size: .76rem; }
.ltr { direction: ltr; text-align: left; unicode-bidi: isolate; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; padding-block: 18px; padding-inline: 12px; gap: 14px; }
.brand { display: grid; gap: 2px; padding-inline: 8px; }
.brand b { font-family: var(--font-display); font-size: 1.12rem; color: #fff; letter-spacing: .01em; }
.brand span { font-size: .74rem; color: var(--side-ink-2); }
.nav-group { display: grid; gap: 2px; }
.nav-title { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--side-ink-2); padding-inline: 10px; margin-block: 6px 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; color: var(--side-ink); text-decoration: none; font-size: .9rem; }
.nav a:hover { background: var(--side-active); }
.nav a.on { background: var(--side-active); color: #fff; font-weight: 600; }
.nav a .ico { width: 16px; height: 16px; flex: none; opacity: .8; }
.nav a .badge { margin-inline-start: auto; background: var(--accent); color: #fff; font-size: .7rem; font-weight: 700; padding: 0 7px; border-radius: 999px; min-width: 20px; text-align: center; }
.nav a .badge.warn { background: #c98500; }
.nav .sub { display: grid; margin-inline-start: 26px; border-inline-start: 1px solid var(--side-line); padding-inline-start: 6px; }
.nav .sub a { font-size: .82rem; padding-block: 4px; color: var(--side-ink-2); }
.nav .sub a.on { color: #fff; background: transparent; font-weight: 600; }
.side-foot { margin-top: auto; font-size: .72rem; color: var(--side-ink-2); padding-inline: 8px; display: grid; gap: 6px; }
.demo-flag { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; letter-spacing: .06em; color: #f5c451; font-size: .72rem; }

.main { min-width: 0; display: flex; flex-direction: column; }
.ctx { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; padding-inline: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.picker { display: grid; gap: 0; }
.picker label { font-size: .68rem; color: var(--ink-3); letter-spacing: .04em; }
.picker select { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 8px; padding: 4px 8px; max-width: 260px; }
.ctx .arrow { color: var(--ink-3); align-self: end; padding-bottom: 6px; }
.outcome-pill .ico { width: 16px; height: 16px; flex: none; }
.outcome-pill { align-self: end; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: .86rem; }
.ctx-tools { margin-inline-start: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: .82rem; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.demo-banner { background: repeating-linear-gradient(-45deg, var(--warn-soft), var(--warn-soft) 10px, var(--surface) 10px, var(--surface) 20px); border-bottom: 1px solid var(--line); color: var(--warn-ink); font-size: .8rem; font-weight: 600; padding-block: 5px; padding-inline: 20px; text-align: center; }

.page { padding-block: 22px 56px; padding-inline: 20px; display: grid; gap: 18px; max-width: 1280px; width: 100%; margin-inline: auto; align-content: start; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.page-head p { color: var(--ink-2); max-width: 70ch; }
.crumbs { font-size: .78rem; color: var(--ink-3); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-hero { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) { .g2, .g-hero, .g3 { grid-template-columns: minmax(0, 1fr); } }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good-ink); }
.chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
.chip.crit { background: var(--critical-soft); color: var(--critical-ink); }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip.outline { background: transparent; border: 1px solid var(--line); }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs a { text-decoration: none; color: var(--ink-2); padding: 7px 12px; border-bottom: 2px solid transparent; font-size: .88rem; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs a .n { font-family: var(--font-data); font-size: .74rem; color: var(--ink-3); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.filters label { display: grid; gap: 2px; font-size: .7rem; color: var(--ink-3); }
.filters select, .filters input { font: inherit; font-size: .84rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 7px; padding: 5px 8px; min-width: 0; max-width: 190px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { text-align: start; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-3); font-weight: 600; font-size: .74rem; letter-spacing: .02em; background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
td .sub { display: block; color: var(--ink-3); font-size: .78rem; }
.nowrap { white-space: nowrap; }

.btn { font-size: .84rem; font-weight: 600; border-radius: 7px; padding: 6px 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-ink); }
.btn:hover { filter: brightness(1.05); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* metrics */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 0; }
.kpi b { font-size: 1.3rem; font-weight: 600; }
.kpi span { font-size: .76rem; color: var(--ink-3); }
.kpi.hl { border-color: var(--accent); background: var(--accent-soft); }
.kpi.hl b { color: var(--accent-ink); }

.goal-figure { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.goal-figure .big { font-family: var(--font-display); font-size: clamp(2.6rem, 6vw, 4rem); font-weight: 700; line-height: 1; }
.goal-figure .of { font-size: 1.05rem; color: var(--ink-2); }
.progress { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.fact { display: grid; gap: 0; } .fact b { font-size: 1.1rem; } .fact span { font-size: .78rem; color: var(--ink-3); }
.ctx-card { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; }
.ctx-card div { display: grid; } .ctx-card span { font-size: .72rem; color: var(--ink-3); } .ctx-card b { font-weight: 600; }

/* charts */
.chart { position: relative; direction: ltr; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font-family: var(--font-body); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-inline-end: 6px; }
.legend i.pace { border-top: 2px dashed var(--pace); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .78rem; padding: 5px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); direction: rtl; z-index: 3; }
[dir="ltr"] .tip { direction: ltr; }

/* funnel & bars */
.funnel { display: grid; gap: 4px; }
.fstage { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 56px; align-items: center; gap: 10px; }
.fstage .name { font-size: .87rem; color: var(--ink-2); }
.bar { height: 22px; background: var(--surface-2); border-radius: 4px; position: relative; }
.bar > i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--accent); border-radius: 4px; min-width: 2px; }
.fstage.out .bar > i { background: var(--good); }
.fstage.lost .bar > i { background: var(--pace); }
.fstage .count { text-align: end; font-weight: 500; }
.frate { font-size: .74rem; color: var(--ink-3); padding-inline-start: calc(min(170px, 30%) + 10px); }
.hbars { display: grid; gap: 7px; }
.hbar { display: grid; grid-template-columns: minmax(100px, 200px) minmax(0, 1fr) minmax(40px, auto); gap: 10px; align-items: center; font-size: .86rem; }
.hbar .track { height: 14px; background: var(--surface-2); border-radius: 3px; position: relative; }
.hbar .track > i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--accent); border-radius: 3px; }
.scorebar { display: inline-grid; grid-template-columns: 54px auto; align-items: center; gap: 6px; }
.scorebar .t { height: 6px; background: var(--surface-3); border-radius: 3px; position: relative; overflow: hidden; }
.scorebar .t i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--accent); }
.scorebar.a .t i { background: var(--good); }
.scorebar.c .t i { background: var(--pace); }

/* queue items */
.list { display: grid; gap: 10px; }
.item { border: 1px solid var(--line); border-radius: 9px; padding: 13px 14px; display: grid; gap: 8px; background: var(--surface); border-inline-start: 4px solid var(--line); min-width: 0; }
.item.s-approval { border-inline-start-color: var(--accent); }
.item.s-medium { border-inline-start-color: var(--warn); }
.item.s-high { border-inline-start-color: var(--critical); }
.item.s-good { border-inline-start-color: var(--good); }
.item.done { opacity: .6; }
.item-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: baseline; }
.item-top b { font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8rem; color: var(--ink-3); align-items: center; }
.msg { background: var(--surface-2); border-radius: 7px; padding: 10px 12px; font-size: .86rem; white-space: pre-line; color: var(--ink-2); overflow-wrap: anywhere; }
.msg .subj { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; }
.msg.in { background: var(--accent-soft); color: var(--ink); }
.conf { display: inline-grid; grid-template-columns: 44px auto; gap: 6px; align-items: center; }
.conf .t { height: 5px; background: var(--surface-3); border-radius: 3px; position: relative; overflow: hidden; }
.conf .t i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--good); }
.conf.low .t i { background: var(--warn); }
.signals { display: grid; gap: 6px; }
.signal { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: .84rem; padding-block: 6px; border-bottom: 1px dashed var(--line); }
.signal:last-child { border-bottom: 0; }
.signal .src { grid-column: 1 / -1; font-size: .76rem; color: var(--ink-3); }
.signal .src a { color: var(--accent-ink); }
.empty { color: var(--ink-3); font-size: .9rem; padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
.note { font-size: .82rem; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.levels { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.levels .lvl { padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-3); font-weight: 600; font-size: .84rem; }
.levels .lvl.on { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 92px 18px minmax(0, 1fr); gap: 8px; font-size: .84rem; }
.tl .when { color: var(--ink-3); font-size: .76rem; text-align: end; padding-top: 2px; }
.tl .dot { position: relative; } .tl .dot::before { content: ""; position: absolute; inset-inline-start: 7px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl .dot::after { content: ""; position: absolute; inset-inline-start: 3px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl .dot.h::after { border-color: var(--good); } .tl .dot.s::after { border-color: var(--pace); }
.tl .what { padding-bottom: 12px; min-width: 0; overflow-wrap: anywhere; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgb(8 12 20 / .45); z-index: 40; }
.drawer { position: fixed; inset-block: 0; inset-inline-end: 0; width: min(560px, 100%); background: var(--bg); z-index: 41; overflow-y: auto; padding-block: calc(16px + env(safe-area-inset-top, 0px)) 32px; padding-inline: 18px; display: grid; gap: 14px; align-content: start; box-shadow: 0 0 40px rgb(0 0 0 / .25); }
.drawer-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }

.toast { position: fixed; inset-inline: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 440px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: .86rem; text-align: center; z-index: 60; }


/* ---------- onboarding, setup, approvals ---------- */
.btn.lg { padding: 10px 20px; font-size: .95rem; border-radius: 9px; }
.btn.small { padding: 3px 9px; font-size: .78rem; }
.btn[aria-disabled="true"] { opacity: .6; }
.actions.center { justify-content: center; }
.create-btn { display: inline-flex; align-items: center; gap: 6px; }
.create-wrap { position: relative; }
.create-menu { position: absolute; inset-inline-end: 0; top: calc(100% + 6px); z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgb(8 12 20 / .18); padding: 6px; width: 260px; display: grid; }
.create-menu button { text-align: start; border: 0; background: transparent; border-radius: 7px; padding: 8px 10px; cursor: pointer; display: grid; gap: 1px; }
.create-menu button:hover:not([disabled]) { background: var(--surface-2); }
.create-menu button[disabled] { opacity: .45; cursor: not-allowed; }
.create-menu button span { font-size: .76rem; color: var(--ink-3); }
.create-menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.welcome { display: grid; gap: 22px; justify-items: center; padding-block: 24px; }
.welcome-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 36px 28px; max-width: 620px; width: 100%; display: grid; gap: 14px; justify-items: center; text-align: center; }
.welcome-card h1 { font-size: 1.7rem; }
.welcome-card p { color: var(--ink-2); max-width: 46ch; }
.welcome-card.success .success-mark { width: 56px; height: 56px; border-radius: 50%; background: var(--good-soft); color: var(--good-ink); display: grid; place-items: center; font-size: 1.6rem; font-weight: 700; }
.how { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 860px; width: 100%; counter-reset: how; }
.how li { counter-increment: how; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 4px; }
.how li::before { content: counter(how); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: .8rem; }
.how li span, .flow li span { font-size: .84rem; color: var(--ink-2); }
.flow { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 6px; text-align: start; }
.flow li { display: grid; gap: 1px; padding: 8px 12px; border-inline-start: 3px solid var(--line); background: var(--surface-2); border-radius: 6px; }
.flow li.on { border-inline-start-color: var(--accent); }
@media (max-width: 700px) { .how { grid-template-columns: minmax(0, 1fr); } }

/** A campaign the agent runs, in the shape every operational page already reads. */
function runCampaign(run) {
  let o = userObjs.get(run.id);
  if (!o) {
    const summary = AcqEngine.summarizeCampaign(run.cfg);
    // Decisions made in the agent workspace are what the operational pages show.
    const rv = new Map((run.review || []).map((i) => [i.id, i]));
    const outreach = run.snapshot.outreach.map((a) => { const i = rv.get(a.id); if (!i) return a; return { ...a, body: i.body, subject: i.subject, status: i.status === "approved" ? "approved" : i.status === "excluded" ? "rejected" : a.status }; });
    o = { ...run.snapshot, outreach, clientId: run.clientId, config: summary, isUser: true, simulated: true, launchedAt: run.launchedAt, run };
    userObjs.set(run.id, o);
  }
  return o;
}
const runOf = (campaignId) => WS.runs.find((r) => r.id === campaignId);

function planOf(conv) {
  const p = conv?.planId ? WS.plans.find((x) => x.id === conv.planId) : null;
  if (p && !p.state) {
    // Plans saved before the campaign state existed: rebuild them from what the conversation recorded.
    const migrated = AcqEngine.applyChanges(p, {}, planCtx(p.locale));
    Object.assign(p, { ...migrated, status: p.status });
    saveWS();
  }

}

async function chatSend(text, opts = {}) {

  S.chatBusy = true; S.pendingText = text; S.composer = ""; S.editMode = false; renderPage(); scrollThread();

function loopStages(c) {
  const P = c?.prospects || []; const sent = (c?.outreach || []).some((a) => a.status === "succeeded");
  return [
    [tr("الهدف", "Goal"), Boolean(c)], [tr("اكتشاف", "Discover"), P.length > 0], [tr("بحث", "Research"), P.some((p) => p.milestones?.researched)],
    [tr("تقييم", "Score"), P.some((p) => p.score != null)], [tr("تخصيص", "Personalize"), (c?.outreach || []).length > 0 || (c?.drafts || []).length > 0],
    [tr("تواصل", "Reach out"), sent], [tr("رد", "Reply"), (c?.replies || []).length > 0], [tr("تأهيل", "Qualify"), P.some((p) => p.milestones?.qualified)],
    [outcomeLabel(c), (c?.report?.outcome?.achieved || 0) > 0], [tr("تعلّم", "Learn"), (c?.recommendations || []).length > 0], [tr("تحسين", "Improve"), (c?.recommendations || []).some((r) => r.status === "applied")],
  ];
}
function loopStrip(c) {
  const st = loopStages(c); const cur = st.findIndex(([, done]) => !done);
  return `<div class="loop" role="list" aria-label="${esc(tr("حلقة العمل الذاتية", "Autonomous loop"))}">${st.map(([l, done], i) => `<span role="listitem" class="loop-node ${done ? "done" : i === cur ? "cur" : ""}">${esc(l)}</span>`).join(`<span class="loop-arrow" aria-hidden="true">${S.lang === "ar" ? "←" : "→"}</span>`)}<span class="loop-arrow back" aria-hidden="true">↺</span></div>`;

function cardHtml(card, msg, conv, isLast) {

    case "text": return `<div class="card-text">${textHtml(card.text)}</div>`;
    case "plan": {
      if (!p) return "";

      const latest = [...conv.messages].reverse().find((x) => (x.cards || []).some((c) => c.kind === "plan" || c.kind === "diff"));
      if (latest && latest.id !== msg.id) return `<p class="tiny muted">${esc(tr("↓ الخطة تحدّثت بعد هذه الرسالة — النسخة الحالية في الأسفل وفي «الخطة».", "↓ The plan changed after this message — the current version is below and under Plan."))}</p>`;
      return planCardHtml(p, { running: Boolean(conv.campaignId && runOf(conv.campaignId)) });

function approvalSummary(all) {
  const open = all.filter((it) => !S.decided[it.id] && it.kind !== "plan");
  const msgs = open.filter((it) => it.kind === "message").length;
  const plans = all.filter((it) => it.kind === "plan");
  const other = open.length - msgs;
  const n = msgs + plans.length + other;
  if (!n) return "";
  return `<section class="ap-summary"><h2>${esc(tr(`الموافقات المطلوبة الآن: ${n}`, `Approvals needed now: ${n}`))}</h2><ul>
    ${msgs ? `<li><span>${esc(tr(`${msgs} رسالة جاهزة للإرسال`, `${msgs} messages ready to send`))}</span><a class="btn" href="#approvals.message">${esc(tr("مراجعة الرسائل", "Review messages"))}</a></li>` : ""}
    ${plans.map((it) => `<li><span>${esc(it.ap.title)}</span><a class="btn" href="#approvals.plan">${esc(tr("مراجعة واعتماد", "Review & approve"))}</a></li>`).join("")}
    ${other ? `<li><span>${esc(tr(`${other} قرار آخر`, `${other} other decisions`))}</span></li>` : ""}
  </ul></section>`;
}

const STEPS = [
  ["outcome", "النتيجة", "Outcome"], ["audience", "الجمهور", "Audience"], ["offer", "العرض", "Offer"], ["qualify", "التأهيل", "Qualification"],
  ["channels", "التواصل", "Channels"], ["control", "التشغيل", "Control"], ["review", "المراجعة", "Review"],
];
function newDraft(clientId) {
  return {
    clientId, campaignId: uid("cp"), campaignName: "",
    outcome: { preset: null, goal: "", customLabel: "", customUnit: "", valueAmount: "", currency: "USD" },
    audience: { countries: [], companyTypes: [], sizeMin: "", sizeMax: "", sectors: [], cities: [], titles: [], traits: [], advanced: { growthSignals: [], technologies: [], customFilters: "" } },
    offer: { name: "", valueProposition: "", callToAction: "", mainMessage: "", link: "", language: S.lang },
    qualification: { criteria: [], threshold: "", requirePositiveReply: true },
    channels: { email: true, linkedin: true, touches: 2, waitDays: 3, language: S.lang, sendWindow: { startHour: 9, endHour: 18 } },
    automation: { level: "human_approval" },
  };
}
const D = () => WS.draft;
const getPath = (o, p) => p.split(".").reduce((x, k) => (x == null ? undefined : x[k]), o);
const setPath = (o, p, v) => { const ks = p.split("."); const last = ks.pop(); const t2 = ks.reduce((x, k) => (x[k] ??= {}), o); t2[last] = v; };
const totalPoints = () => D().qualification.criteria.reduce((s, c) => s + Math.max(0, Number(c.points) || 0), 0);

function stepIssues(i) {
  const d = D(); const out = [];
  if (i === 0) {
    if (!d.clientId) out.push(tr("اختر العميل", "Choose the client"));
    if (!d.campaignName.trim()) out.push(tr("اسم الحملة", "Campaign name"));
    if (!d.outcome.preset) out.push(tr("اختر النتيجة", "Choose an outcome"));
    if (!(Number(d.outcome.goal) > 0)) out.push(tr("حدد الهدف (رقم)", "Set the goal (a number)"));
    if (d.outcome.preset === "custom" && !d.outcome.customLabel.trim()) out.push(tr("اسم النتيجة المخصصة", "Name of the custom outcome"));
  }
  if (i === 1) {
    if (!d.audience.countries.length) out.push(tr("اختر سوقاً واحداً على الأقل", "Choose at least one market"));
    if (!d.audience.companyTypes.length && !d.audience.sectors.length) out.push(tr("نوع الشركات أو القطاع", "Company type or sector"));
  }
  if (i === 2) {
    if (!d.offer.name.trim()) out.push(tr("اسم العرض", "Offer name"));
    if (!d.offer.valueProposition.trim()) out.push(tr("القيمة الأساسية", "Core value"));
    if (!d.offer.callToAction.trim()) out.push(tr("الدعوة لاتخاذ إجراء", "Call to action"));
    if (!d.offer.mainMessage.trim()) out.push(tr("الرسالة الرئيسية", "Main message"));
  }
  if (i === 3) {
    if (!d.qualification.criteria.length) out.push(tr("أضف معياراً واحداً على الأقل", "Add at least one criterion"));
    if (d.qualification.criteria.some((c) => !c.label.trim())) out.push(tr("كل معيار يحتاج اسماً", "Every criterion needs a name"));
    const th = Number(d.qualification.threshold); if (!(th > 0) || th > totalPoints()) out.push(tr(`الدرجة المطلوبة بين 1 و${totalPoints()}`, `Required score between 1 and ${totalPoints()}`));
  }
  if (i === 4 && !d.channels.email && !d.channels.linkedin) out.push(tr("فعّل قناة واحدة على الأقل", "Enable at least one channel"));
  return out;
}
function checkFor(c) {
  const a = D().audience; const t2 = c.check || "research";
  if (t2 === "size") return { type: "size", min: Number(a.sizeMin) || 0, max: Number(a.sizeMax) || 1000000 };
  if (t2 === "role") return { type: "role", titles: a.titles.length ? a.titles : ["CEO", "Founder", "Managing Director", "مدير عام", "مؤسس"] };
  if (t2 === "budget") return { type: "budget", min: Number(c.min) || 0 };
  if (t2 === "location") return a.cities.length ? { type: "location", cities: a.cities } : { type: "location", countries: a.countries };
  return { type: "research" };
}
function toBuilderDraft(status) {
  const d = D(); const cl = clients().find((c) => c.id === d.clientId);
  const num = (v) => (v === "" || v == null ? undefined : Number(v));
  return {
    locale: S.lang,
    client: { id: cl.id, name: cl.name, industry: cl.industry || undefined, market: cl.market || undefined },
    campaign: { id: d.campaignId, name: d.campaignName.trim(), status, periodStart: nowIso().slice(0, 10) },
    outcome: {
      preset: d.outcome.preset, goal: Number(d.outcome.goal), customLabel: d.outcome.customLabel || undefined, customUnit: d.outcome.customUnit || undefined,
      value: Number(d.outcome.valueAmount) > 0 ? { amount: Number(d.outcome.valueAmount), currency: d.outcome.currency || "USD", recurrence: d.outcome.preset === "paid_subscriber" ? "monthly" : "one_time" } : undefined,
    },
    audience: { ...d.audience, sizeMin: num(d.audience.sizeMin), sizeMax: num(d.audience.sizeMax), advanced: { ...d.audience.advanced, customFilters: d.audience.advanced.customFilters || undefined } },
    offer: { ...d.offer, link: d.offer.link || undefined },
    qualification: { criteria: d.qualification.criteria.map((c) => ({ label: c.label.trim(), points: Number(c.points) || 0, timing: Boolean(c.timing), check: checkFor(c) })), threshold: Number(d.qualification.threshold), requirePositiveReply: d.qualification.requirePositiveReply },
    channels: { ...d.channels, touches: Number(d.channels.touches) === 1 ? 1 : 2, waitDays: Number(d.channels.waitDays) || 3, sendWindow: { startHour: Number(d.channels.sendWindow.startHour), endHour: Number(d.channels.sendWindow.endHour) } },
    automation: { ...d.automation },
  };
}
function tryBuild(status = "draft") {
  try { const cfg = AcqEngine.buildCampaignConfig(toBuilderDraft(status), PRESETS); return { cfg, summary: AcqEngine.summarizeCampaign(cfg) }; }
  catch (e) { return { error: e.issues ? e.issues : [String(e.message || e)] }; }
}

function audienceSentence() {
  const a = D().audience; const ar = S.lang === "ar"; const sep = SEP();

function qualificationSuggestions() {
  const a = D().audience; const have = new Set(D().qualification.criteria.map((c) => c.label));
  const out = [];
  for (const ct of a.companyTypes.slice(0, 2)) out.push({ label: ct, points: 20, check: "research" });
  if (a.sizeMin || a.sizeMax) out.push({ label: tr(`حجم الشركة ${a.sizeMin || 1}–${a.sizeMax || "+"} موظفاً`, `${a.sizeMin || 1}–${a.sizeMax || "+"} employees`), points: 10, check: "size" });
  out.push({ label: tr("صاحب قرار", "Decision maker"), points: 5, check: "role" });
  for (const t2 of a.traits) out.push({ label: t2, points: 10, check: "research" });
  for (const t2 of a.advanced.technologies || []) out.push({ label: tr(`يستخدم ${t2}`, `Uses ${t2}`), points: 10, check: "research" });
  out.push({ label: tr("مؤشر نمو حديث (توظيف، توسع)", "Recent growth signal (hiring, expansion)"), points: 5, check: "research", timing: true });
  return out.filter((s) => !have.has(s.label));
}

function wizardStep(i) {
  const d = D(); const ar = S.lang === "ar";
  if (i === 0) {
    const cl = clients();
    const clientBlock = cl.length > 1
      ? field("w-client", tr("العميل", "Client"), `<select id="w-client" data-bind="clientId">${cl.map((c) => `<option value="${esc(c.id)}" ${c.id === d.clientId ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>`)

function approvalItems(scopeAll) {
  const list = scopeAll ? campaigns() : [C()].filter(Boolean);

  for (const c of list) {

    const openP = new Set(c.exceptions.filter((e) => e.status === "open" && !S.decided[e.id]).map((e) => e.prospectId));
    for (const a of c.outreach.filter((a) => a.status === "pending_approval")) items.push({ kind: "message", id: a.id, c, a, p: P.get(a.prospectId), flagged: openP.has(a.prospectId) });
    for (const r of c.recommendations.filter((r) => r.status === "open")) items.push({ kind: "change", id: r.id, c, r });

    for (const a of pendingPlanChanges(c.config.id)) items.push({ kind: "plan", id: a.id, c, ap: a });
  }
  return items;
}

const svgEl = (tag, attrs = {}) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };

  svg.append(svgEl("path", { d: `M${pts.join(" L")}`, fill: "none", stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round" }));
  const last = series.length - 1;
  svg.append(svgEl("circle", { cx: x(last), cy: y(series[last]), r: 5, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }));
  const cross = svgEl("line", { y1: P.t, y2: H - P.b, stroke: "var(--ink-3)", "stroke-width": 1, visibility: "hidden" });
  const dot = svgEl("circle", { r: 4, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
  const hit = svgEl("rect", { x: P.l, y: P.t, width: W - P.l - P.r, height: H - P.t - P.b, fill: "transparent" });

    for (const el of [cross]) { el.setAttribute("x1", x(i)); el.setAttribute("x2", x(i)); el.setAttribute("visibility", "visible"); }

function funnelReach(c = C()) {
  const stages = c.config.funnel; const P = c.prospects;
  const idx = new Map(stages.map((s, i) => [s.key, i]));
  const lostKey = stages.find((s) => s.milestone === "lost")?.key;
  const counted = c.outcomes.filter((o) => o.counted).length;
  return stages.filter((s) => s.key !== lostKey).map((s) => {
    let n;
    if (s.milestone === "outcome") n = counted;
    else if (s.milestone) n = P.filter((p) => p.milestones[s.milestone]).length;
    else n = P.filter((p) => p.stage !== lostKey && idx.get(p.stage) >= idx.get(s.key)).length;
    return { key: s.key, label: L(s.label), n, isOutcome: s.milestone === "outcome" };
  }).concat(lostKey ? [{ key: lostKey, label: L(stages.find((s) => s.key === lostKey).label), n: P.filter((p) => p.stage === lostKey).length, lost: true }] : []);
}
function funnelHtml(c = C()) {

  });
  return h + `</div>`;
}

function recSummary(r) {
  const ev = r.evidence || {};
  const rate = (a) => (a && a.sent ? Math.round(((a.positive + 2 * a.outcomes) / a.sent) * 1000) / 10 : 0);
  if (r.change?.op === "disable_variant") {
    const tk = r.change.templateKey; const b = ev.best, w = ev.worst;
    return S.lang === "ar" ? `إيقاف «${variantLabel(`${tk}:${w.key}`)}» (${rate(w)}% من ${w.sent} رسالة) والاعتماد على «${variantLabel(`${tk}:${b.key}`)}» (${rate(b)}% من ${b.sent}).`
      : `Retire "${variantLabel(`${tk}:${w.key}`)}" (${rate(w)}% of ${w.sent} sends) in favour of "${variantLabel(`${tk}:${b.key}`)}" (${rate(b)}% of ${b.sent}).`;
  }
  if (r.change?.op === "raise_min_score") {
    const tier = C().config.scoring.tiers.find((x) => x.key === ev.tier);
    return S.lang === "ar" ? `«${L(tier?.label ?? ev.tier)}» لم تُنتج ردوداً إيجابية من ${ev.sent} عميلاً تم التواصل معهم — ركّز على تقييم ${r.change.value} فأعلى.`
      : `"${tier?.label ?? ev.tier}" produced no positive replies from ${ev.sent} contacted prospects — focus on scores of ${r.change.value}+.`;
  }
  return r.summary;
}

function pageScoring() {

/* prospect drawer */
function drawer(id) {
  const c = C(); const x = X(); const p = x.P.get(id); if (!p) return "";
  const ar = S.lang === "ar";
  const thread = [...(x.sentBy.get(id) || []).map((a) => ({ at: a.executedAt, dir: "out", body: a.body, subject: a.subject, channel: a.channel, step: a.step })), ...(x.repliesBy.get(id) || []).map((r) => ({ at: r.at, dir: "in", body: r.body, intent: r.intent, channel: r.channel }))].sort((a, b) => (a.at || "").localeCompare(b.at || ""));
  const appt = c.appointments.filter((a) => a.prospectId === id);
  const out = c.outcomes.find((o) => o.prospectId === id && o.counted);
  return `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(p.company || p.contact)}">
    <div class="drawer-head"><div><div class="crumbs">${esc(t("prospects"))}</div><h2>${esc(p.company || p.contact)}</h2><div class="meta"><span>${esc(p.contact)} · ${esc(p.title || "")}</span><span>${esc(L(p.city))}</span>${p.employees ? `<span class="num">${p.employees} ${esc(ar ? "موظف" : "staff")}</span>` : ""}</div></div><button class="btn" type="button" data-act="close" aria-label="Close">✕</button></div>
    <div class="meta"><span class="chip accent">${esc(stageLabel(p.stage))}</span>${rsChip(p.researchStatus)}${csChip(p.contactStatus)}${out ? `<span class="chip good">✓ ${esc(outcomeLabel())}</span>` : ""}${p.parkedReason ? `<span class="chip">${esc(p.parkedReason === "no_contact" ? (ar ? "متوقف: لا جهة اتصال" : "Parked: no contact") : p.parkedReason)}</span>` : ""}${p.status === "parked" && !p.parkedReason ? `<span class="chip">${esc(ar ? "تحت حد التواصل" : "Below outreach threshold")}</span>` : ""}</div>
    <section class="panel"><div class="panel-head"><h3>${esc(t("score"))}</h3>${scoreBar(p)}</div>
      ${p.breakdown.length ? `<div class="hbars">${p.breakdown.map((b) => `<div class="hbar"><span>${esc(L(b.label))}${b.category === "timing" ? ` <span class="chip tiny">${esc(t("whyNow"))}</span>` : ""}</span><div class="track"><i style="width:${(b.weight / Math.max(...c.config.scoring.signals.map((s) => s.weight))) * 100}%"></i></div><span class="num">+${b.weight}</span></div>`).join("")}</div>` : `<p class="small muted">—</p>`}
      ${(() => { const missingSig = c.config.scoring.signals.filter((s) => !p.breakdown.some((b) => b.key === s.key)); return missingSig.length ? `<p class="tiny muted">${esc(ar ? "لم يتحقق: " : "Not met: ")}${esc(missingSig.map((s) => `${L(s.label)} (${s.weight})`).join(SEP()))}</p>` : ""; })()}</section>
    <section class="panel"><h3>${esc(t("research"))}</h3>${p.signals.length ? `<div class="signals">${p.signals.map((s) => `<div class="signal"><span><b>${esc(keyLabel(s.key))}:</b> ${esc(fmtVal(s.value))}</span><span class="tiny num">${Math.round(s.confidence * 100)}%</span><span class="src">${esc(t("source"))}: ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.source)}</a>` : esc(s.source)}</span></div>`).join("")}</div>` : `<p class="small muted">—</p>`}
      ${p.rejected.length ? `<p class="small" style="color:var(--warn-ink)">▲ ${esc(t("noSource"))}: ${esc(p.rejected.map(keyLabel).join(SEP()))}</p>` : ""}</section>
    ${p.qualification ? `<section class="panel"><h3>${esc(t("qualReasons"))}</h3><p class="small">✓ ${esc(p.qualification.met.map((k) => L(c.config.qualification.find((q) => q.key === k)?.label ?? k)).join(SEP()) || "—")}</p>${p.qualification.missing.length ? `<p class="small muted">✕ ${esc(p.qualification.missing.map((k) => L(c.config.qualification.find((q) => q.key === k)?.label ?? k)).join(SEP()))}</p>` : ""}</section>` : ""}
    ${appt.length ? `<section class="panel"><h3>${esc(L(c.config.appointments.label))}</h3>${appt.map((a) => `<p class="small">${esc(fmtDT(a.startsAt))} · ${esc(t({ scheduled: "scheduled", held: "held", cancelled: "cancelled", no_show: "noShow" }[a.status]))}</p>`).join("")}</section>` : ""}
    <section class="panel"><h3>${esc(ar ? "المحادثة" : "Conversation")}</h3>${thread.length ? thread.map((m) => `<div><div class="tiny muted">${esc(fmtDT(m.at))} · ${esc(L(m.channel))}${m.step ? ` · ${esc(stepLabel(m.step))}` : ""}${m.intent ? ` · ${intentChip(m.intent)}` : ""}</div><div class="msg ${m.dir === "in" ? "in" : ""} ${/[؀-ۿ]/.test(m.body || "") ? "" : "ltr"}">${m.subject ? `<span class="subj">${esc(m.subject)}</span>` : ""}${esc(m.body)}</div></div>`).join("") : `<p class="small muted">${esc(ar ? "لم يُتواصل معه بعد." : "Not contacted yet.")}</p>`}</section>
  </aside>`;
}

const PAGES = { agent: pageAgent, plan: pagePlan, overview: pageOverview, approvals: pageApprovals, attention: pageApprovals, "new-campaign": pageWizard, campaigns: pageCampaigns, prospects: pageProspects, research: pageResearch, contacts: pageContacts, outreach: pageOutreach, replies: pageReplies, appointments: pageAppointments, outcomes: pageOutcomes, analytics: pageAnalytics, reports: pageReports, integrations: pageIntegrations, automation: pageAutomation, audit: pageAudit, settings: pageSettings, recommendations: pageRecommendations };
const CLIENT_PAGES = new Set(["agent", "plan", "overview", "approvals", "attention", "outcomes", "appointments", "recommendations", "reports", "new-campaign"]);
function parseHash() {
  const h = (location.hash || "#agent").slice(1); const [route, ...rest] = h.split(".");
  S.route = PAGES[route] ? route : "agent"; S.sub = rest.join(".");
  if (S.route === "attention") S.route = "approvals";
  if (S.view === "client" && !CLIENT_PAGES.has(S.route)) { S.route = "overview"; S.sub = ""; }
  if (S.route === "appointments" && !C()?.config.appointments) { S.route = "overview"; S.sub = ""; }
}
function renderPage() {
  const page = document.getElementById("page");
  const c = C();
  page.innerHTML = (!c && !["new-campaign", "agent"].includes(S.route)) || (S.newGoal && S.route === "agent") ? (S.newGoal && !S.chatBusy ? agentHero() : pageAgent()) : PAGES[S.route]();
  if (c && c.daily.length) {
    const days = c.daily.map((d) => d.day); let acc = 0; const cum = c.daily.map((d) => (acc += d.outcomes));
    page.querySelectorAll('[data-chart="trend"]').forEach((el) => lineChart(el, cum, c.config.outcome.target, days));
    page.querySelectorAll('[data-chart="sent"]').forEach((el) => barChart(el, c.daily.map((d) => d.sent), days, t("sentPerDay")));
  }
}
function render() {
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
  if (!clients().some((c) => c.id === S.clientId)) { S.clientId = clients()[0]?.id ?? null; S.campaignId = null; }
  parseHash();
  const c = C();
  document.title = c ? `${clientName(S.clientId)} · ${L(c.config.name)} — ${t("product")}` : t("product");
  renderSide(); renderCtx(); renderPage();
  document.getElementById("overlay").innerHTML = (S.drawer && c ? drawer(S.drawer) : "") + modalHtml();
  document.getElementById("app").classList.remove("nav-open");
}
/** Re-render only the page (used while typing in setup forms) and keep focus/caret. */
function refreshPage() {
  const a = document.activeElement; const id = a?.id; let pos = null;
  try { pos = a?.selectionStart; } catch {}
  renderPage(); renderSide();
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch {} } }
}
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (el.hidden = true), 2800); }
function confirmBox(title, text, yes, onYes, note, no) { S.modal = { type: "confirm", title, text, yes, onYes, note, no }; render(); }
function startCampaign() {
  S.menu = false; S.newGoal = true; S.editMode = false; WS.agent.convId = null; saveWS();

function startWizard() {
  S.menu = false;

});
document.addEventListener("keydown", (ev) => {
  if ((["heroInput", "composerInput"].includes(ev.target.id) || ev.target.id?.startsWith?.("ce-")) && ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); ev.target.closest("form")?.requestSubmit(); return; }
  if (ev.key === "Escape") { if (S.modal) { S.modal = null; render(); return; } if (S.menu) { S.menu = false; renderCtx(); return; } if (S.drawer) { S.drawer = null; render(); return; } }
  const chip = ev.target.closest?.("[data-chips]");
  if (chip && (ev.key === "Enter" || ev.key === "," || ev.key === "،")) {
    ev.preventDefault();
    const v = chip.value.trim(); if (!v) return;
    const path = chip.dataset.chips; const arr = getPath(WS.draft, path) || [];
    if (!arr.includes(v)) setPath(WS.draft, path, [...arr, v]);
    saveWS(); refreshPage(); document.getElementById(chip.id)?.focus();
  }
  if (chip && ev.key === "Backspace" && !chip.value) { const arr = getPath(WS.draft, chip.dataset.chips) || []; if (arr.length) { setPath(WS.draft, chip.dataset.chips, arr.slice(0, -1)); saveWS(); refreshPage(); } }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "heroInput") { S.heroDraft = ev.target.value; return; }
  if (ev.target.id === "composerInput") { S.composer = ev.target.value; return; }
  const m = ev.target.closest("[data-m]");
  if (m && S.modal) { S.modal.data[m.dataset.m] = m.value; return; }
  const b = ev.target.closest("[data-bind]");
  if (b && WS.draft) {
    setPath(WS.draft, b.dataset.bind, b.value); saveWS();
    if (b.type === "range") { const n = document.getElementById("w-th"); if (n) n.value = b.value; return; } // keep dragging smooth
    if (b.tagName !== "SELECT") refreshPage();
    return;
  }
  const el = ev.target.closest("[data-filter]"); if (!el) return;
  S.filters[el.dataset.filter] = el.value; S.limit = 50;
  const pos = el.selectionStart; const key = el.dataset.filter; render();
  const again = document.querySelector(`[data-filter="${key}"]`); if (again && again.tagName === "INPUT") { again.focus(); try { again.setSelectionRange(pos, pos); } catch {} }
});
document.addEventListener("change", (ev) => {
  const b = ev.target.closest("[data-bind]");
  if (b && WS.draft && b.type === "range") { refreshPage(); return; }
  if (b && WS.draft && b.tagName === "SELECT") { setPath(WS.draft, b.dataset.bind, b.value); saveWS(); refreshPage(); return; }
  const bb = ev.target.closest("[data-bind-bool]");
  if (bb && WS.draft) { setPath(WS.draft, bb.dataset.bindBool, bb.checked); saveWS(); refreshPage(); }
});
render();
</script>
